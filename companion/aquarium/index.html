<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Glub Aquarium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; }
    #main { display: contents; }
    #bowl { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; color: inherit; }
    .cross-nav {
      position: fixed; top: 0; left: 0; right: 0; height: 32px;
      display: flex; justify-content: center; align-items: stretch;
      background: rgba(12, 30, 48, 0.78); border-bottom: 1px solid #1c3a52;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 50; font-family: "Courier New", "Consolas", monospace;
      font-size: 0.72rem; letter-spacing: 1px; text-transform: lowercase;
    }
    .cross-nav .nav-link {
      display: flex; align-items: center; padding: 0 14px;
      color: #7fb4d4; text-decoration: none; position: relative;
      transition: color 0.15s, background 0.15s;
    }
    .cross-nav .nav-link:hover { color: #c0e4f4; background: rgba(74, 154, 190, 0.15); }
    .cross-nav .nav-link.active { color: #ff8b3d; font-weight: 700; }
    .cross-nav .nav-link.active::after {
      content: ""; position: absolute; left: 10%; right: 10%; bottom: 0;
      height: 2px; background: #ff8b3d;
    }
    @media (max-width: 520px) {
      .cross-nav { font-size: 0.64rem; }
      .cross-nav .nav-link { padding: 0 8px; letter-spacing: 0.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cross-nav .nav-link { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="cross-nav" aria-label="GlubLM surfaces">
    <a href="https://den-sec.github.io/glublm/desk-pet/" class="nav-link" target="_blank" rel="noopener">desk pet</a>
    <a href="/aquarium/" class="nav-link active" aria-current="page">aquarium</a>
    <a href="/controller/" class="nav-link">controller</a>
    <a href="https://github.com/Den-Sec/glublm" class="nav-link" target="_blank" rel="noopener">github</a>
  </nav>

  <main id="main">
    <h1 class="sr-only">Glub Aquarium</h1>
    <canvas id="bowl" role="img" aria-label="A pixel-art goldfish living in a bowl. Watch it swim, eat, sleep, and react to its environment."></canvas>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
